name: Сборка NEXUS v0.1.3

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35"
      - name: Скачать Godot и шаблоны
        run: |
          mkdir -p /tmp/godot /tmp/templates
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          find /tmp/templates -name android_release.apk -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name android_debug.apk -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name android_source.zip -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name version.txt -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Проверить проект
        working-directory: game
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit
      - name: Собрать и проверить подписанный Android APK
        working-directory: game
        run: |
          set -e
          STOREPASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore /tmp/nexus-release.keystore -alias nexus -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STOREPASS" -keypass "$STOREPASS" -dname "CN=NEXUS,O=NEXUS,OU=Game,C=NL"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/nexus-release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=nexus
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$STOREPASS"
          mkdir -p build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Android" build/NEXUS.apk
          $ANDROID_HOME/build-tools/35.0.1/apksigner verify --verbose build/NEXUS.apk
          $ANDROID_HOME/build-tools/35.0.1/aapt2 dump badging build/NEXUS.apk | head -20
          unzip -l build/NEXUS.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' | head -20
      - name: Собрать Windows
        continue-on-error: true
        working-directory: game
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/NEXUS.exe
          cd build
          zip -q NEXUS-Windows-v0.1.3.zip NEXUS.exe
      - name: Загрузить Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-v0.1.3-Android
          path: game/build/NEXUS.apk
          if-no-files-found: error
      - name: Опубликовать Android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.3 --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create v0.1.3 game/build/NEXUS.apk --repo ${{ github.repository }} --title "NEXUS v0.1.3 - Android signed" --notes "Исправлена ошибка установки: APK подписан release-keystore и содержит ARM64 + ARMv7."
