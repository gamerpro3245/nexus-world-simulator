name: Сборка NEXUS v0.1.2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35"

      - name: Скачать Godot и шаблоны
        run: |
          mkdir -p /tmp/godot /tmp/templates
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          find /tmp/templates -name android_release.apk -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name android_debug.apk -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name android_source.zip -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name version.txt -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Создать keystore
        run: |
          keytool -genkeypair -v             -keystore /tmp/nexus-release.keystore             -alias nexus             -keyalg RSA -keysize 2048 -validity 10000             -storepass nexusrelease             -keypass nexusrelease             -dname "CN=NEXUS,O=NEXUS,OU=Game,C=NL"

      - name: Проверить проект
        working-directory: game
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit

      - name: Собрать подписанный Android APK
        working-directory: game
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/nexus-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: nexus
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: nexusrelease
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Android" build/NEXUS.apk
          $ANDROID_HOME/build-tools/35.0.1/apksigner verify --verbose --min-sdk-version 23 build/NEXUS.apk
          $ANDROID_HOME/build-tools/35.0.1/aapt2 dump badging build/NEXUS.apk | head -20
          unzip -l build/NEXUS.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' | head -20

      - name: Собрать Windows
        working-directory: game
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/NEXUS.exe
          cd build
          zip -q NEXUS-Windows-v0.1.2.zip NEXUS.exe

      - name: Загрузить сборки
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-v0.1.2
          path: |
            game/build/NEXUS.apk
            game/build/NEXUS-Windows-v0.1.2.zip
          if-no-files-found: error

      - name: Опубликовать Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 game/build/NEXUS.apk game/build/NEXUS-Windows-v0.1.2.zip             --repo ${{ github.repository }}             --title "NEXUS v0.1.2 - Android signed"             --notes "Исправлена главная причина ошибки «Пакет недействителен»: APK теперь подписан release-keystore. Добавлена поддержка ARM64 и ARMv7."
