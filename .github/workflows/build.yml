name: Сборка NEXUS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
      - name: Настроить JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Настроить Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35"
      - name: Скачать Godot 4.7.2
        run: |
          mkdir -p /tmp/godot
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot/godot.zip
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/godot/templates.tpz
          unzip -q /tmp/godot/godot.zip -d /tmp/godot/bin
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          tar -xf /tmp/godot/templates.tpz -C ~/.local/share/godot/export_templates/4.7.2.stable
          chmod +x /tmp/godot/bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Импортировать проект
        working-directory: game
        run: /tmp/godot/bin/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit
      - name: Собрать Windows
        working-directory: game
        run: |
          mkdir -p build
          /tmp/godot/bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/NEXUS.exe
          cd build
          zip -q NEXUS-Windows-v0.1.0.zip NEXUS.exe
      - name: Собрать Android APK
        working-directory: game
        run: |
          /tmp/godot/bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/NEXUS.apk
      - name: Загрузить сборки
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-v0.1.0
          path: |
            game/build/NEXUS-Windows-v0.1.0.zip
            game/build/NEXUS.apk
          if-no-files-found: error
