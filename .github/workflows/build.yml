name: Сборка NEXUS Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35"
      - name: Скачать Godot и шаблоны
        run: |
          mkdir -p /tmp/godot /tmp/templates
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          curl -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          find /tmp/templates -name android_release.apk -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name android_debug.apk -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name android_source.zip -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          find /tmp/templates -name version.txt -exec cp {} ~/.local/share/godot/export_templates/4.7.2.stable/ \;
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Проверить проект
        working-directory: game
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit
      - name: Собрать Android APK
        working-directory: game
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/NEXUS.apk
          $ANDROID_HOME/build-tools/35.0.1/apksigner verify --verbose build/NEXUS.apk
          unzip -l build/NEXUS.apk | grep 'lib/arm64-v8a/'
      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-v0.1.1-Android
          path: game/build/NEXUS.apk
          if-no-files-found: error
      - name: Опубликовать Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 game/build/NEXUS.apk --repo ${{ github.repository }} --title "NEXUS v0.1.1 - Android test" --notes "Тестовый Android APK ARM64."
